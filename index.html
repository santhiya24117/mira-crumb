    <script>
      // Suppress benign dev-server HMR websocket disconnection error in cloud container preview
      (function() {
        function isBenignWsError(err) {
          if (!err) return false;
          var str = String((err && (err.message || err.reason || err.stack || err)) || '');
          return str.includes('WebSocket') || str.includes('websocket') || str.includes('[vite]') || str.includes('closed without opened');
        }

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String(a && a.message ? a.message : a); }).join(' ');
          if (isBenignWsError(joined)) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String(a && a.message ? a.message : a); }).join(' ');
          if (isBenignWsError(joined)) {
            return;
          }
          origConsoleWarn.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isBenignWsError(event && event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isBenignWsError(event && (event.message || event.error))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>

  </body>
